<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedia.com - Payment Methods</title>

  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <!-- Font Awesome 5 CSS -->
  <link rel="stylesheet" href="css/all.css">
</head>
<body>

  <div class="container-fluid p-3">
    
    <!-- Filter Card -->
    <div class="card my-2">
      <div class="card-header bg-primary text-white">
        <h5 class="m-0"><i class="fas fa-filter"></i> Filter Options</h5>
      </div>
      <div class="card-body">
        <!-- Filter Notifications -->
        <div id="filterNotifications" class="mb-3"></div>

        <div class="form-row align-items-end">
          <div class="form-group col-md-4">
            <label for="filterStatus">Status</label>
            <select id="filterStatus" class="form-control form-control-sm">
              <option value="all">All Statuses</option>
              <option value="1">Active</option>
              <option value="0">Inactive</option>
            </select>
          </div>

          <div class="form-group col-md-6">
            <label for="filterPaymentMethodName">Payment Method Name</label>
            <div class="input-group">
              <input type="text" id="filterPaymentMethodName" class="form-control form-control-sm" placeholder="e.g., M-Pesa, Credit Card">
              <div class="input-group-append">
                <button id="btnSearchPaymentMethods" class="btn btn-success btn-sm" type="button">
                  <i class="fas fa-search"></i> Search
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Data Table Card -->
    <div class="card my-2">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="m-0"><i class="fas fa-wallet"></i> Payment Methods</h5>
        <button id="btnAddNewPaymentMethod" class="btn btn-success btn-sm">
          <i class="fas fa-plus"></i> Add New Payment Method
        </button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table id="paymentMethodsTable" class="table table-sm table-striped borderless m-0">
            <thead class="thead-light">
              <tr>
                <th>#</th>
                <th>Code</th>
                <th>Method Name</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="paymentMethodsTableBody">
              <!-- Dynamically populated via jQuery AJAX -->
              <tr>
                <td colspan="5" class="text-center text-muted py-3">Loading payment methods...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Modal: Payment Method Details (Add / Edit) -->
  <div class="modal fade" id="paymentMethodModal" tabindex="-1" role="dialog" aria-labelledby="paymentMethodModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        
        <div class="modal-header bg-light">
          <h5 class="modal-title" id="paymentMethodModalTitle">Payment Method Details</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <div class="modal-body">
          <!-- Form Notifications -->
          <div id="paymentMethodNotifications"></div>

          <form id="paymentMethodForm">
            <!-- Hidden Input for Editing -->
            <input type="hidden" id="paymentMethodId" name="payment_method_id" value="0">

            <div class="form-group">
              <label for="paymentMethodCode">Code <span class="text-danger">*</span></label>
              <input type="text" id="paymentMethodCode" class="form-control form-control-sm" placeholder="e.g., MPESA, CARD, CASH" required>
            </div>

            <div class="form-group">
              <label for="paymentMethodName">Method Name <span class="text-danger">*</span></label>
              <input type="text" id="paymentMethodName" class="form-control form-control-sm" placeholder="e.g., M-Pesa Mobile Money" required>
            </div>

            <div class="form-group">
              <label for="paymentMethodStatus">Status</label>
              <select id="paymentMethodStatus" class="form-control form-control-sm">
                <option value="1">Active</option>
                <option value="0">Inactive</option>
              </select>
            </div>
          </form>
        </div>

        <div class="modal-footer bg-light">
          <button type="button" id="btnSavePaymentMethod" class="btn btn-success btn-sm">
            <i class="fas fa-save"></i> Save
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm" data-dismiss="modal">
            <i class="fas fa-times"></i> Close
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- JavaScript Dependencies -->
  <script src="js/jquery-3.7.1.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/functions.js"></script>
  <script src="js/payment_methods.js"></script>

</body>
</html>
